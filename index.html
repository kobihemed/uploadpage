<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ענן שיתוף קבצים | העלאה מאובטחת</title>
  
  <!-- גופן מודרני מבית Google Fonts (Heebo) מותאם במיוחד לעברית -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
      --primary-hover: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #c026d3 100%);
      --bg-gradient: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                         radial-gradient(at 100% 100%, rgba(217, 70, 239, 0.15) 0px, transparent 50%),
                         radial-gradient(at 50% 50%, rgba(56, 189, 248, 0.1) 0px, transparent 50%),
                         #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.6);
      --input-border: rgba(148, 163, 184, 0.25);
      --success-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --danger: #f43f5e;
      --dropzone-border: rgba(139, 92, 246, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Heebo', -apple-system, BlinkMacSystemFont, sans-serif;
      direction: rtl;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
      overflow-x: hidden;
    }

    .app-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      width: 100%;
      max-width: 500px;
      padding: 36px 30px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.55),
                  0 0 40px rgba(99, 102, 241, 0.15);
      position: relative;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .badge-top {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(99, 102, 241, 0.18);
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #a5b4fc;
      margin-bottom: 16px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background-color: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 10px #38bdf8;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .title {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 30%, #cbd5e1 70%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      line-height: 1.25;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 26px;
      line-height: 1.5;
    }

    .field-wrapper {
      margin-bottom: 22px;
      text-align: right;
    }

    label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 8px;
    }

    label span.hint {
      font-size: 0.78rem;
      font-weight: 400;
      color: #94a3b8;
    }

    .input-box {
      width: 100%;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 0.98rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .input-box:focus {
      border-color: #8b5cf6;
      background: rgba(15, 23, 42, 0.85);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.2);
    }

    .input-box::placeholder {
      color: #64748b;
    }

    .drop-zone {
      border: 2px dashed var(--dropzone-border);
      border-radius: 20px;
      padding: 32px 18px;
      text-align: center;
      background: rgba(30, 41, 59, 0.4);
      cursor: pointer;
      position: relative;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      margin-bottom: 20px;
    }

    .drop-zone:hover {
      border-color: #a855f7;
      background: rgba(99, 102, 241, 0.08);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.15);
    }

    .drop-zone.dragover {
      border-color: #d946ef;
      background: rgba(217, 70, 239, 0.12);
      transform: scale(1.02);
      box-shadow: 0 0 25px rgba(217, 70, 239, 0.3);
    }

    .icon-container {
      width: 60px;
      height: 60px;
      margin: 0 auto 14px;
      border-radius: 18px;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px -5px rgba(139, 92, 246, 0.5);
      transition: transform 0.3s ease;
    }

    .drop-zone:hover .icon-container {
      transform: scale(1.1) rotate(4deg);
    }

    .icon-container svg {
      width: 30px;
      height: 30px;
      fill: #ffffff;
    }

    .drop-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 4px;
    }

    .drop-desc {
      font-size: 0.82rem;
      color: #94a3b8;
    }

    .file-list {
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .file-list::-webkit-scrollbar {
      width: 5px;
    }
    .file-list::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 10px;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 0.85rem;
      animation: fileSlideIn 0.25s ease forwards;
    }

    @keyframes fileSlideIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .file-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-meta-name {
      font-weight: 600;
      color: #e2e8f0;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta-size {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    .file-remove-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .file-remove-btn:hover {
      color: var(--danger);
      background: rgba(244, 63, 94, 0.15);
    }

    .progress-section {
      display: none;
      margin-bottom: 18px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: #cbd5e1;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--primary-gradient);
      border-radius: 10px;
      transition: width 0.35s ease;
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.8);
    }

    .submit-btn {
      width: 100%;
      background: var(--primary-gradient);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.5);
      transition: all 0.25s ease;
    }

    .submit-btn:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(139, 92, 246, 0.65);
    }

    .submit-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .submit-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .status-alert {
      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 500;
      text-align: center;
      animation: fadeIn 0.3s ease;
    }

    .status-alert.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
    }

    .status-alert.error {
      display: block;
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fb7185;
    }

    /* התאמות לטלפונים ניידים */
    @media (max-width: 480px) {
      .app-card {
        padding: 26px 20px;
        border-radius: 22px;
      }
      .title {
        font-size: 1.6rem;
      }
      .drop-zone {
        padding: 26px 12px;
      }
    }
  </style>
</head>
<body>

  <main class="app-card">
    <div class="badge-top">
      <span class="badge-dot"></span>
      <span>אחסון ישיר ומאובטח</span>
    </div>

    <h1 class="title">העלאת קבצים ותמונות</h1>
    <p class="subtitle">העלאה מהירה של תמונות ומסמכים מכל מכשיר, בקלות ובנוחות מרבית.</p>

    <!-- שדה שם השולח -->
    <div class="field-wrapper">
      <label for="uploaderName">
        שם השולח
        <span class="hint">(יוצר עבורך תיקייה אישית בכונן)</span>
      </label>
      <input type="text" id="uploaderName" class="input-box" placeholder="השאר ריק למשלוח אנונימי">
    </div>

    <!-- אזור גרירה ובחירת קבצים -->
    <div class="drop-zone" id="dropArea" onclick="document.getElementById('fileInput').click()">
      <div class="icon-container">
        <svg viewBox="0 0 24 24">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
        </svg>
      </div>
      <div class="drop-title">לחץ כאן לבחירה או גרור לכאן</div>
      <div class="drop-desc">תמיכה בתמונות, סרטונים, ומסמכים (ניתן לבחור מספר קבצים)</div>
    </div>

    <!-- Input סמוי לבחירת קבצים -->
    <input type="file" id="fileInput" multiple style="display:none;" onchange="handleFileSelect(event)">

    <!-- רשימת קבצים שנבחרו -->
    <div class="file-list" id="fileList"></div>

    <!-- פס התקדמות -->
    <div class="progress-section" id="progressSection">
      <div class="progress-info">
        <span id="progressText">מעלה קבצים...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <!-- כפתור העלאה -->
    <button id="submitBtn" class="submit-btn" onclick="submitUpload()" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
      <span id="submitBtnText">העלה קבצים עכשיו</span>
    </button>

    <!-- הודעות סטטוס -->
    <div id="statusAlert" class="status-alert"></div>
  </main>

  <script>
    // כתובת ה-Web App שלך מ-Google Apps Script (יש לוודא שהיא מעודכנת)
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwFpuqc3RkFdLCYm8SSbQHGCk2FR721KiZ4lEcpHcZNX47nzJd3HMSIacrULUK4jQni/exec';

    let filesArray = [];
    const dropArea = document.getElementById('dropArea');
    const fileListEl = document.getElementById('fileList');
    const submitBtn = document.getElementById('submitBtn');
    const submitBtnText = document.getElementById('submitBtnText');
    const progressSection = document.getElementById('progressSection');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const progressPercent = document.getElementById('progressPercent');
    const statusAlert = document.getElementById('statusAlert');

    // ניהול אירועי Drag & Drop
    ['dragenter', 'dragover'].forEach(name => {
      dropArea.addEventListener(name, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropArea.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(name => {
      dropArea.addEventListener(name, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropArea.classList.remove('dragover');
      }, false);
    });

    dropArea.addEventListener('drop', (e) => {
      const files = Array.from(e.dataTransfer.files);
      if (files.length) appendFiles(files);
    }, false);

    function handleFileSelect(e) {
      const files = Array.from(e.target.files);
      if (files.length) appendFiles(files);
      // איפוס ה-input כדי לאפשר לבחור שוב את אותו קובץ במידת הצורך
      e.target.value = '';
    }

    function appendFiles(newFiles) {
      filesArray = [...filesArray, ...newFiles];
      renderFileList();
    }

    function removeFile(index) {
      filesArray.splice(index, 1);
      renderFileList();
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function renderFileList() {
      fileListEl.innerHTML = '';
      hideStatus();

      if (filesArray.length === 0) {
        submitBtn.disabled = true;
        submitBtnText.textContent = 'העלה קבצים עכשיו';
        return;
      }

      filesArray.forEach((file, index) => {
        const item = document.createElement('div');
        item.className = 'file-item';

        item.innerHTML = `
          <div class="file-meta">
            <svg style="width: 18px; height: 18px; fill: #8b5cf6; flex-shrink: 0;" viewBox="0 0 24 24">
              <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
            </svg>
            <div>
              <div class="file-meta-name" title="${file.name}">${file.name}</div>
              <div class="file-meta-size">${formatBytes(file.size)}</div>
            </div>
          </div>
          <button class="file-remove-btn" onclick="removeFile(${index})" title="הסר קובץ">
            <svg style="width: 18px; height: 18px;" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
          </button>
        `;
        fileListEl.appendChild(item);
      });

      submitBtn.disabled = false;
      submitBtnText.textContent = `העלה ${filesArray.length} ${filesArray.length === 1 ? 'קובץ' : 'קבצים'}`;
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    function showStatus(text, type) {
      statusAlert.className = `status-alert ${type}`;
      statusAlert.textContent = text;
    }

    function hideStatus() {
      statusAlert.className = 'status-alert';
      statusAlert.textContent = '';
    }

    async function submitUpload() {
      if (!filesArray.length) return;

      const name = document.getElementById('uploaderName').value.trim();
      submitBtn.disabled = true;
      hideStatus();

      // הצגת מד התקדמות
      progressSection.style.display = 'block';
      progressBar.style.width = '0%';

      let successCount = 0;
      let failCount = 0;
      const total = filesArray.length;

      for (let i = 0; i < total; i++) {
        const currentFile = filesArray[i];
        const progressVal = Math.round((i / total) * 100);

        progressBar.style.width = `${progressVal}%`;
        progressPercent.textContent = `${progressVal}%`;
        progressText.textContent = `מעלה קובץ ${i + 1} מתוך ${total}: ${currentFile.name}`;

        try {
          const fileData = await readFileAsDataURL(currentFile);
          const payload = {
            fileData: fileData,
            fileName: currentFile.name,
            name: name
          };

          const res = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          const result = await res.json();

          if (result.success) {
            successCount++;
          } else {
            failCount++;
          }
        } catch (err) {
          failCount++;
        }
      }

      // סיום ההעלאה
      progressBar.style.width = '100%';
      progressPercent.textContent = '100%';
      progressText.textContent = 'ההעלאה הסתיימה!';

      setTimeout(() => {
        progressSection.style.display = 'none';

        if (failCount === 0) {
          showStatus(`✨ מעולה! כל ${successCount} הקבצים הועלו בהצלחה לענן.`, 'success');
          filesArray = [];
          renderFileList();
        } else {
          showStatus(`הועלו בהצלחה: ${successCount} קבצים. נכשלו: ${failCount} קבצים.`, 'error');
          submitBtn.disabled = false;
        }
      }, 700);
    }
  </script>
</body>
</html>

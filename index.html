<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>העלאת קבצים</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
      --success: #16a34a;
      --danger: #dc2626;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      direction: rtl;
    }
    .container {
      background: var(--card);
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08);
      padding: 24px;
      text-align: right;
    }
    h2 {
      font-size: 1.35rem;
      margin-bottom: 6px;
      text-align: center;
    }
    p.subtitle {
      font-size: 0.9rem;
      color: #64748b;
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      direction: rtl;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
    }
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      background: #fafafa;
      margin-bottom: 16px;
    }
    .dropzone svg {
      width: 44px;
      height: 44px;
      fill: #94a3b8;
      margin-bottom: 8px;
    }
    .file-status {
      font-size: 0.9rem;
      font-weight: 500;
      color: #334155;
      margin-top: 6px;
      max-height: 120px;
      overflow-y: auto;
    }
    button.submit-btn {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.submit-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    button.submit-btn:hover:not(:disabled) {
      background: var(--primary-hover);
    }
    .msg {
      margin-top: 14px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }
    .msg.success {
      color: var(--success);
      display: block;
    }
    .msg.error {
      color: var(--danger);
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>העלאת קבצים ותמונות</h2>
    <p class="subtitle">העלאה מהירה ישירות לאחסון</p>

    <div class="form-group">
      <label for="uploaderName">שם השולח (תיפתח תיקייה ייעודית בשמך):</label>
      <input type="text" id="uploaderName" placeholder="השאר ריק להעלאה אנונימית">
    </div>

    <div class="dropzone" id="dropArea" onclick="document.getElementById('fileInput').click()">
      <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
      <div><strong>לחץ לבחירת קבצים</strong> או גרור לכאן</div>
      <div class="file-status" id="fileStatus">טרם נבחרו קבצים</div>
    </div>
    
    <!-- הוספת multiple מאפשרת בחירת מספר קבצים במקביל -->
    <input type="file" id="fileInput" multiple style="display:none;" onchange="handleFileSelect(event)">

    <button id="submitBtn" class="submit-btn" onclick="submitUpload()" disabled>העלה קבצים</button>
    <div id="responseMsg" class="msg"></div>
  </div>

  <script>
    // הדבק כאן את כתובת ה-Web App שלך מה-Apps Script
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwFpuqc3RkFdLCYm8SSbQHGCk2FR721KiZ4lEcpHcZNX47nzJd3HMSIacrULUK4jQni/exec';

    let selectedFiles = [];
    const dropArea = document.getElementById('dropArea');

    ['dragenter', 'dragover'].forEach(name => {
      dropArea.addEventListener(name, (e) => { e.preventDefault(); }, false);
    });
    ['dragleave', 'drop'].forEach(name => {
      dropArea.addEventListener(name, (e) => { e.preventDefault(); }, false);
    });
    dropArea.addEventListener('drop', (e) => {
      const files = Array.from(e.dataTransfer.files);
      if (files.length) handleChosenFiles(files);
    }, false);

    function handleFileSelect(e) {
      const files = Array.from(e.target.files);
      if (files.length) handleChosenFiles(files);
    }

    function handleChosenFiles(files) {
      selectedFiles = files;
      const status = document.getElementById('fileStatus');
      const submitBtn = document.getElementById('submitBtn');

      if (files.length === 1) {
        status.textContent = `נבחר קובץ אחד: ${files[0].name}`;
      } else {
        status.textContent = `נבחרו ${files.length} קבצים להעלאה`;
      }
      submitBtn.disabled = false;
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    async function submitUpload() {
      if (!selectedFiles.length) return;

      const submitBtn = document.getElementById('submitBtn');
      const msg = document.getElementById('responseMsg');
      const name = document.getElementById('uploaderName').value;

      submitBtn.disabled = true;
      msg.className = 'msg';
      msg.textContent = '';

      let successCount = 0;
      let failCount = 0;

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        submitBtn.textContent = `מעלה קובץ ${i + 1} מתוך ${selectedFiles.length}...`;

        try {
          const fileData = await readFileAsDataURL(file);
          const payload = {
            fileData: fileData,
            fileName: file.name,
            name: name
          };

          const res = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          const result = await res.json();

          if (result.success) {
            successCount++;
          } else {
            failCount++;
          }
        } catch (err) {
          failCount++;
        }
      }

      submitBtn.textContent = 'העלה קבצים';
      if (failCount === 0) {
        msg.className = 'msg success';
        msg.textContent = `כל ${successCount} הקבצים הועלו בהצלחה!`;
        document.getElementById('fileStatus').textContent = 'טרם נבחרו קבצים';
        document.getElementById('fileInput').value = '';
        selectedFiles = [];
      } else {
        msg.className = 'msg error';
        msg.textContent = `הועלו בהצלחה: ${successCount}, נכשלו: ${failCount}`;
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>

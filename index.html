<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>העלאת קבצים</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
      --success: #16a34a;
      --danger: #dc2626;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      direction: rtl;
    }
    .container {
      background: var(--card);
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08);
      padding: 24px;
      text-align: right;
    }
    h2 {
      font-size: 1.35rem;
      margin-bottom: 6px;
      text-align: center;
    }
    p.subtitle {
      font-size: 0.9rem;
      color: #64748b;
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      direction: rtl;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
    }
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      background: #fafafa;
      margin-bottom: 16px;
    }
    .dropzone svg {
      width: 44px;
      height: 44px;
      fill: #94a3b8;
      margin-bottom: 8px;
    }
    .file-status {
      font-size: 0.9rem;
      font-weight: 500;
      color: #334155;
      word-break: break-all;
      margin-top: 6px;
    }
    button.submit-btn {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.submit-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    button.submit-btn:hover:not(:disabled) {
      background: var(--primary-hover);
    }
    .msg {
      margin-top: 14px;
      font-size: 0.9rem;
      text-align: center;
      display: none;
    }
    .msg.success {
      color: var(--success);
      display: block;
    }
    .msg.error {
      color: var(--danger);
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>העלאת קבצים ותמונות</h2>
    <p class="subtitle">העלאה מהירה ישירות לאחסון</p>

    <div class="form-group">
      <label for="uploaderName">שם השולח (לא חובה):</label>
      <input type="text" id="uploaderName" placeholder="השאר ריק למשלוח אנונימי">
    </div>

    <div class="dropzone" id="dropArea" onclick="document.getElementById('fileInput').click()">
      <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
      <div><strong>לחץ לבחירת קובץ</strong> או גרור לכאן</div>
      <div class="file-status" id="fileStatus">טרם נבחר קובץ</div>
    </div>
    
    <input type="file" id="fileInput" style="display:none;" onchange="handleFileSelect(event)">

    <button id="submitBtn" class="submit-btn" onclick="submitUpload()" disabled>העלה קובץ</button>
    <div id="responseMsg" class="msg"></div>
  </div>

  <script>
    // הדבק כאן את כתובת ה-Web App משלב 2
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxrORhtwsCbBk2q0A8RM2fo6qQQxqC4ngi0o0zTrg7FFe0_EtdtStm8q2Z8DgYcQ1V-/exec';

    let selectedFile = null;
    const dropArea = document.getElementById('dropArea');

    ['dragenter', 'dragover'].forEach(name => {
      dropArea.addEventListener(name, (e) => { e.preventDefault(); }, false);
    });
    ['dragleave', 'drop'].forEach(name => {
      dropArea.addEventListener(name, (e) => { e.preventDefault(); }, false);
    });
    dropArea.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length) handleChosenFile(files[0]);
    }, false);

    function handleFileSelect(e) {
      if (e.target.files.length) handleChosenFile(e.target.files[0]);
    }

    function handleChosenFile(file) {
      selectedFile = file;
      document.getElementById('fileStatus').textContent = `נבחר: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
      document.getElementById('submitBtn').disabled = false;
    }

    async function submitUpload() {
      if (!selectedFile) return;

      const submitBtn = document.getElementById('submitBtn');
      const msg = document.getElementById('responseMsg');
      const name = document.getElementById('uploaderName').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'מעלה... נא להמתין';
      msg.className = 'msg';
      msg.textContent = '';

      const reader = new FileReader();
      reader.onload = async function(e) {
        const payload = {
          fileData: e.target.result,
          fileName: selectedFile.name,
          name: name
        };

        try {
          const res = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          const result = await res.json();

          submitBtn.textContent = 'העלה קובץ';
          if (result.success) {
            msg.className = 'msg success';
            msg.textContent = 'הקובץ הועלה בהצלחה!';
            document.getElementById('fileStatus').textContent = 'טרם נבחר קובץ';
            document.getElementById('fileInput').value = '';
            selectedFile = null;
          } else {
            msg.className = 'msg error';
            msg.textContent = 'שגיאה: ' + result.error;
            submitBtn.disabled = false;
          }
        } catch (err) {
          submitBtn.textContent = 'העלה קובץ';
          submitBtn.disabled = false;
          msg.className = 'msg error';
          msg.textContent = 'שגיאת תקשורת עם השרת.';
        }
      };
      reader.readAsDataURL(selectedFile);
    }
  </script>
</body>
</html>
